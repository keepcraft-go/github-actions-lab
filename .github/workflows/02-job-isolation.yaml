name: Job Isolation Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create file
        run: |
          echo "hello from build job" > result.txt
          cat result.txt
      - name : Set version
        id : version 
        run : echo "number=1.0.0" >> "$GITHUB_OUTPUT"

      - name: Use version in same job
        run: echo "Version is ${{ steps.version.outputs.number }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Read file
        run: cat result.txt