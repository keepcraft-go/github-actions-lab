name: Job Isolation Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.number }}

    steps:
      - name: Create file
        run: |
          echo "hello from build job" > result.txt
          cat result.txt
      - name : Set version
        id : version 
        run : echo "number=1.0.0" >> "$GITHUB_OUTPUT"

      - name: Create result file 
        run: |
          echo "This is a result file from the build job" > result.txt
          echo "version 1.0.${{ github.run_number }}" >> result.txt
          cat result.txt
      
      - name: Upload result file
        uses: actions/upload-artifact@v4
        with:
          name: result-file
          path: result.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Use version from build job
        run: echo "Version is ${{ needs.build.outputs.version }}"

      - name: Download result file
        uses: actions/download-artifact@v4
        with:
          name: result-file
      
      - name: Check result file
        run: cat result.txt