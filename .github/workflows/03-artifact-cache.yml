name: Artifact and Cache Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        run: |
          mkdir -p dist
          echo "=== Building application ==="
          cp app/index.html dist/
          echo "Build info: run ${{ github.run_number }}" >> dist/app.txt
          echo "=== Build complete ==="
          ls -al dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist/

      - name: Verify artifact contents
        run: |
          echo "=== Downloaded artifact ==="
          ls -al dist/
          echo ""
          echo "=== index.html ==="
          cat dist/index.html
          echo ""
          echo "=== app.txt ==="
          cat dist/app.txt