name: Env Output Secret Lab

on:
  workflow_dispatch:

env:
  GLOBAL_ENV: "I am global"       # Workflow 레벨 (모든 Job, Step에서 사용)

jobs:
  env-scope-demo:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: "I am job-level"    # Job 레벨 (이 Job의 모든 Step에서 사용)

    steps:
      - name: All env variables
        env:
          STEP_ENV: "I am step-level"  # Step 레벨 (이 Step에서만 사용)
        run: |
          echo "=== Env Scope Demo ==="
          echo "GLOBAL: $GLOBAL_ENV"
          echo "JOB:    $JOB_ENV"
          echo "STEP:   $STEP_ENV"

      - name: Step env is gone
        run: |
          echo "=== Next Step ==="
          echo "GLOBAL: $GLOBAL_ENV"
          echo "JOB:    $JOB_ENV"
          echo "STEP:   ${STEP_ENV:-<empty>}"   # STEP_ENV는 이 Step에서 없음
  output-demo:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.set-version.outputs.version }}
      build-date: ${{ steps.set-date.outputs.date }}

    steps:
      - name: Generate version
        id: set-version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"

      - name: Generate build date
        id: set-date
        run: |
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Build date: $DATE"

      - name: Use both outputs
        run: |
          echo "=== Build Summary ==="
          echo "Version:    ${{ steps.set-version.outputs.version }}"
          echo "Build date: ${{ steps.set-date.outputs.date }}"

  use-outputs:
    runs-on: ubuntu-latest
    needs: output-demo

    steps:
      - name: Use job outputs from previous job
        run: |
          echo "=== Deployment Info ==="
          echo "Deploying version: ${{ needs.output-demo.outputs.app-version }}"
          echo "Built at:          ${{ needs.output-demo.outputs.build-date }}"